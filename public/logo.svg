<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5BA3E6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3478C2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="doc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EDF5FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bg)"/>
  <!-- Document shape -->
  <path d="M160 80 L352 80 L392 120 L392 432 L120 432 L120 80 Z" fill="url(#doc)" opacity="0.95"/>
  <!-- Document fold corner -->
  <path d="M352 80 L352 120 L392 120 Z" fill="#B8D4F0"/>
  <!-- Text lines on document -->
  <rect x="160" y="160" width="192" height="12" rx="6" fill="#8BB8D9"/>
  <rect x="160" y="192" width="160" height="12" rx="6" fill="#8BB8D9"/>
  <rect x="160" y="224" width="192" height="12" rx="6" fill="#8BB8D9"/>
  <rect x="160" y="256" width="120" height="12" rx="6" fill="#8BB8D9"/>
  <!-- Checkmark circle -->
  <circle cx="340" cy="360" r="64" fill="#ffffff" opacity="0.25"/>
  <polyline points="308,360 332,384 376,336" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Hanko/stamp circle (Japanese seal) -->
  <circle cx="200" cy="360" r="40" fill="none" stroke="#3478C2" stroke-width="6" opacity="0.8"/>
  <text x="200" y="370" font-family="IPAPGothic, sans-serif" font-size="36" fill="#3478C2" text-anchor="middle" opacity="0.8">契</text>
</svg>
