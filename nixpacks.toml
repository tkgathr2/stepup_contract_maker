[phases.setup]
nixPkgs = ["nodejs_20"]
aptPkgs = [
  "chromium",
  "libnss3",
  "libatk-bridge2.0-0",
  "libdrm2",
  "libxkbcommon0",
  "libgbm1",
  "libasound2",
  "libpango-1.0-0",
  "libcairo2",
  "libcups2",
  "libxrandr2",
  "libxdamage1",
  "libxcomposite1",
  "fonts-noto-cjk"
]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npx prisma generate && npx next build"]

[start]
cmd = "npx prisma migrate deploy && npm start"
