[phases.setup]
nixPkgs = ["nodejs_20", "chromium"]
aptPkgs = [
  "libnss3",
  "libatk-bridge2.0-0",
  "libdrm2",
  "libxkbcommon0",
  "libgbm1",
  "libasound2",
  "libpango-1.0-0",
  "libcairo2",
  "libcups2",
  "libxrandr2",
  "libxdamage1",
  "libxcomposite1",
  "fonts-noto-cjk",
  "fonts-liberation",
  "libappindicator3-1",
  "libgtk-3-0",
  "libnspr4",
  "libx11-xcb1",
  "libxcursor1",
  "libxfixes3",
  "libxi6",
  "libxss1",
  "libxtst6",
  "xdg-utils"
]

[phases.install]
cmds = ["PUPPETEER_SKIP_DOWNLOAD=true npm ci"]

[phases.build]
cmds = ["npx prisma generate && npx next build"]

[start]
cmd = "npm start"
