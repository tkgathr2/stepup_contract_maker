[phases.setup]
nixPkgs = ["nodejs_20"]
aptPkgs = [
  "libnss3",
  "libnspr4",
  "libatk-bridge2.0-0",
  "libdrm2",
  "libxkbcommon0",
  "libgbm1",
  "libasound2",
  "libpango-1.0-0",
  "libcairo2",
  "libcups2",
  "libxrandr2",
  "libxdamage1",
  "libxcomposite1",
  "libx11-xcb1",
  "libxtst6",
  "libxss1",
  "libxfixes3",
  "libxi6",
  "libxcursor1",
  "libgtk-3-0",
  "libdbus-1-3",
  "libexpat1",
  "fonts-noto-cjk",
  "fonts-liberation"
]

[phases.install]
cmds = ["PUPPETEER_SKIP_DOWNLOAD=true npm ci"]

[phases.build]
cmds = ["npx prisma generate && npx next build"]

[start]
cmd = "export LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:/lib/x86_64-linux-gnu:/usr/lib:$LD_LIBRARY_PATH && npm start"
