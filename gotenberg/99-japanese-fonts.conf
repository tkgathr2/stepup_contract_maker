<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Japanese font substitution: Windows fonts → installed Japanese alternatives -->
<fontconfig>
  <!-- ＭＳ Ｐゴシック → IPAGothic -->
  <alias>
    <family>ＭＳ Ｐゴシック</family>
    <prefer><family>IPAGothic</family></prefer>
  </alias>
  <alias>
    <family>MS PGothic</family>
    <prefer><family>IPAGothic</family></prefer>
  </alias>

  <!-- ＭＳ ゴシック → IPAGothic -->
  <alias>
    <family>ＭＳ ゴシック</family>
    <prefer><family>IPAGothic</family></prefer>
  </alias>
  <alias>
    <family>MS Gothic</family>
    <prefer><family>IPAGothic</family></prefer>
  </alias>

  <!-- ＭＳ Ｐ明朝 → IPAMincho -->
  <alias>
    <family>ＭＳ Ｐ明朝</family>
    <prefer><family>IPAMincho</family></prefer>
  </alias>
  <alias>
    <family>MS PMincho</family>
    <prefer><family>IPAMincho</family></prefer>
  </alias>

  <!-- ＭＳ 明朝 → IPAMincho -->
  <alias>
    <family>ＭＳ 明朝</family>
    <prefer><family>IPAMincho</family></prefer>
  </alias>
  <alias>
    <family>MS Mincho</family>
    <prefer><family>IPAMincho</family></prefer>
  </alias>

  <!-- Yu Gothic → Noto Sans CJK JP -->
  <alias>
    <family>Yu Gothic</family>
    <prefer><family>Noto Sans CJK JP</family></prefer>
  </alias>
  <alias>
    <family>游ゴシック</family>
    <prefer><family>Noto Sans CJK JP</family></prefer>
  </alias>

  <!-- Yu Mincho → Noto Serif CJK JP -->
  <alias>
    <family>Yu Mincho</family>
    <prefer><family>Noto Serif CJK JP</family></prefer>
  </alias>
  <alias>
    <family>游明朝</family>
    <prefer><family>Noto Serif CJK JP</family></prefer>
  </alias>

  <!-- メイリオ → Noto Sans CJK JP -->
  <alias>
    <family>メイリオ</family>
    <prefer><family>Noto Sans CJK JP</family></prefer>
  </alias>
  <alias>
    <family>Meiryo</family>
    <prefer><family>Noto Sans CJK JP</family></prefer>
  </alias>

  <!-- Century → Noto Serif -->
  <alias>
    <family>Century</family>
    <prefer><family>Noto Serif</family></prefer>
  </alias>

  <!-- Default Japanese preference: prefer JP variants over SC/TC -->
  <match>
    <test name="lang" compare="contains">
      <string>ja</string>
    </test>
    <test name="family" compare="contains">
      <string>Noto Sans CJK</string>
    </test>
    <edit name="family" mode="prepend">
      <string>Noto Sans CJK JP</string>
    </edit>
  </match>

  <match>
    <test name="lang" compare="contains">
      <string>ja</string>
    </test>
    <test name="family" compare="contains">
      <string>Noto Serif CJK</string>
    </test>
    <edit name="family" mode="prepend">
      <string>Noto Serif CJK JP</string>
    </edit>
  </match>

  <!-- Force Japanese locale preference for CJK fonts -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK JP</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK JP</string>
    </edit>
  </match>
</fontconfig>
